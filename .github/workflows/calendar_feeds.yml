name: Publish Lunch Menu Calendars

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/calendar_feeds.yml'
      - 'calendar_config.py'
      - 'calendar_feed.py'
      - 'menu_page.py'
      - 'menu_common.py'
      - 'nutrislicemenu.py'
      - 'requirements.txt'
  schedule:
    # Refresh every school-year morning so the rolling seven-day page reflects
    # late menu changes. Extra Wednesday/Thursday runs catch next-week menus
    # soon after they are commonly published.
    - cron: '43 6 * 1-6,9-12 *'
      timezone: 'America/New_York'
    - cron: '43 16 * 1-6,9-12 3-4'
      timezone: 'America/New_York'

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Generate calendar feeds
        run: python calendar_feed.py --output-dir _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
