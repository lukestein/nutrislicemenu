name: Send Lunch Menu Notification

on:
  # Allows you to run this manually from the Actions tab for testing
  workflow_dispatch:
  
  # Schedule: Sunday through Thursday
  schedule:
    # GitHub Actions uses UTC time. 
    # Newton, MA is UTC-5 (EST) or UTC-4 (EDT).
    # 22:00 UTC = 6:00 PM EDT (Summer) / 5:00 PM EST (Winter)
    # 23:00 UTC = 7:00 PM EDT (Summer) / 6:00 PM EST (Winter)
    # We will use 22:00 (10 PM UTC) to ensure it hits the evening window.
    - cron: '0 22 * * 0-4'

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Caches dependencies to speed up future runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Menu Script
        run: python nutrislicemenu.py