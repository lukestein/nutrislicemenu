name: Send Lunch Menu Notification

on:
  workflow_dispatch:
  schedule:
    # Sunday-Thursday evenings during the school year, for the next school
    # day's menu. A non-zero minute reduces top-of-the-hour runner delays.
    - cron: '17 18 * 1-6,9-12 0-4'
      timezone: 'America/New_York'

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Run Menu Script
        env:
          NTFY_TOPIC_STUB: ${{ secrets.NTFY_TOPIC_STUB }}
        run: python nutrislicemenu.py
